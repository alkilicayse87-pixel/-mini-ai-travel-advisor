services:
  - type: web
    name: ai-travel-advisor
    runtime: docker
    plan: free
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false # set in the Render dashboard, never in git
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: GLOBAL_LIMIT_PER_HOUR
        value: "200"
      - key: DAILY_BUDGET_USD
        value: "2.0"
      - key: MAX_CONVERSATION_USD
        value: "0.25"
      - key: ALLOWED_ORIGINS
        sync: false # set to your exact frontend URL in the Render dashboard
